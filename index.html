<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
  <link rel="stylesheet" href="style.css"/>
  <title>MohamedEchaara</title>
</head>
<body>
  <div id="container">
    <div id="app">
      <section id="product-section">
        <header class="section-header">
          <h2>Desserts</h2>
        </header>
        <div id="product-list">
         
        </div>
      </section>

      <main id="cart-section">
        <div class="cart-wrapper">
          <p class="cart-title">Your cart (<span id="cart-count">0</span>)</p>
          <div class="cart-empty">
            <img src="assets/images/illustration-empty-cart.svg" alt="Empty cart image" class="cart-empty-img" />
          </div>
          <div class="cart-total">
            <p>Total price:</p>
            <p>$<span id="cart-total-price">0</span></p>
          </div>
          <div class="cart-items">
          </div>
          <div class="cart-note">
            <img src="assets/images/icon-carbon-neutral.svg" alt="Carbon neutral icon" />
            <p>This is a <span>carbon-neutral</span> order</p>
          </div>
          <button id="btn-confirm-order">Confirm Order</button>
        </div>
      </main>
    </div>
  </div>
  <div class="attribution">
    Challenge by 
    <a href="https://www.frontendmentor.io?ref=Challenge">Frontend Mentor</a>.Coded by <a href="#">Moamed Ech-Chara</a>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
